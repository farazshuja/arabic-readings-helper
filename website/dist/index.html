<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153f67">
  <meta name="description" content="Practice reading beginner Arabic stories. Reveal harakat one line at a time and explore English and Urdu vocabulary.">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23153f67'/%3E%3Cpath d='M7 8h7l2 2 2-2h7v17h-7l-2 2-2-2H7z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M16 10v16' stroke='white' stroke-width='2'/%3E%3C/svg%3E">

<body>
  <a class="skip" href="#main">Skip to reading</a>
  <header class="site-header">
    <a class="brand" href="#" aria-label="Qira’ah story library"><span class="brand-symbol" lang="ar">ق</span><span>Qira’ah<span class="brand-sub">ARABIC READING</span></span></a>
